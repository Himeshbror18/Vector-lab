name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach the APK to; leave empty to use the latest release'
        required: false
        default: ''
  push:
    branches: [main]
    tags: ['*']
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vector-lab-android
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Resolve release tag
        id: release
        if: inputs.release_tag != '' || github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='${{ inputs.release_tag }}'
          if [ -z "$TAG" ]; then TAG='${{ github.event.release.tag_name }}'; fi
          if [ -z "$TAG" ] && [[ '${{ github.ref }}' == refs/tags/* ]]; then TAG='${{ github.ref_name }}'; fi
          if [ -z "$TAG" ]; then TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"; fi
          if [ -z "$TAG" ]; then echo 'No GitHub release exists yet; APK remains available as a workflow artifact.'; exit 0; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Attach APK to GitHub Release
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: false
