name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to attach the APK to
        required: false
        default: Physics
  push:
    branches: [main]
    tags: ['*']
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vector-lab-android
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.event.release.tag_name }}"; fi
          if [ -z "$TAG" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then TAG="${{ github.ref_name }}"; fi
          if [ -z "$TAG" ]; then TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Upload APK to release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.release.outputs.tag }}" android/app/build/outputs/apk/release/app-release.apk --repo "${{ github.repository }}" --clobber
