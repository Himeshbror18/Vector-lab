name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach the APK to (for example Physics)'
        required: false
        default: ''
  push:
    tags: ['*']
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vector-lab-android
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Attach APK to GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: false
